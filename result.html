<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Generated QR Code — Download in PNG & PDF</title>
    <meta name="description"
        content="Your custom QR code is generated and ready to download in ultra high-resolution 2048px PNG or print-ready A4 PDF with Level H error correction.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://qrcode-generator.pages.dev/result.html">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://qrcode-generator.pages.dev/result.html">
    <meta property="og:title" content="Your Generated QR Code — Download in PNG & PDF">
    <meta property="og:description"
        content="Your custom QR code is generated and ready to download in ultra high-resolution 2048px PNG or print-ready A4 PDF with Level H error correction.">
    <meta property="og:site_name" content="QR Code Generator">

    <!-- Theme & Favicon -->
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'%3E%3Cpath d='M3 11V3h8v8H3zm2-6v4h4V5H5zM3 21v-8h8v8H3zm2-6v4h4v-4H5zm8-10h8v8h-8V5zm2 6h4V7h-4v4zm-2 4h2v2h-2v-2zm4 0h2v2h-2v-2zm-4 4h2v2h-2v-2zm4 0h2v2h-2v-2zm4 0h2v2h-2v-2zm0-4h2v2h-2v-2zm-4 2h2v2h-2v-2z'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

    <main class="app-shell">
        <!-- Top Navigation -->
        <div class="top-bar">
            <a href="index.html" class="back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Back to Generator
            </a>
        </div>

        <!-- Result Card -->
        <div class="main-card qr-display-card">
            <!-- 1:1 Square Frame for QR Code -->
            <div class="qr-frame">
                <div id="qrcode"></div>
            </div>

            <!-- Content Display with Copy Button -->
            <div class="payload-box">
                <span class="payload-text" id="payloadText">Loading...</span>
                <button type="button" class="copy-btn" id="copyBtn" title="Copy to clipboard">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" />
                    </svg>
                    Copy
                </button>
            </div>

            <!-- Download Options: PNG & PDF Only (High Quality) -->
            <div class="download-actions">
                <button type="button" class="btn-download btn-download--png" id="downloadPng">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    Download PNG
                </button>
                <button type="button" class="btn-download btn-download--pdf" id="downloadPdf">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    Download PDF
                </button>
            </div>

            <!-- Generate Another -->
            <a href="index.html" class="btn-secondary">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
                Generate Another QR Code
            </a>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast-msg"></div>

    <script src="script.js"></script>
</body>

</html>
